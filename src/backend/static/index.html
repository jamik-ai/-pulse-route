<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пульс маршрута</title>
<link rel="icon" href="/static/logo-pulse.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@600&family=Rubik+Mono+One&family=Poiret+One&family=Days+One&family=Handjet:wght@600&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --label:#1D1D1F; --label2:#6E6E73; --label3:#86868B; --bg:#F5F5F7;
  --glass:rgba(255,255,255,.82); --card:#FFFFFF; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.07);
  --sep:rgba(60,60,67,.12); --blue:#0071E3; --blue2:#007AFF;
  --green:#34C759; --green-t:#248A3D; --green-bg:#E9F7EE;
  --yellow:#FFCC00; --yellow-t:#946200; --yellow-bg:#FFF6D6;
  --red:#FF3B30; --red-t:#D70015; --red-bg:#FFECEB;
  --shadow:0 8px 32px rgba(0,0,0,.10);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,sans-serif;
  --brand:"Tektur",var(--sf);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:var(--sf);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(0,113,227,.45);outline-offset:1px}
#map{position:fixed;inset:0;background:var(--bg);z-index:1}
#map.ya,#map.ya.leaflet-container{background:transparent}
#ymap{position:fixed;top:0;right:0;bottom:0;left:372px;z-index:1;display:none}  /* левее — панель; логотип Яндекса остаётся виден */
#ymap.muted .ymaps-2-1-79-ground-pane{opacity:.62}
body.ya #ctl{bottom:44px}body.ya .legend{bottom:44px}  /* не закрываем копирайт Яндекса */
.ylab{font:500 11px var(--sf);color:#3A3A3C;white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;pointer-events:none}
.leaflet-container{background:var(--bg);font-family:var(--sf)}
#map.muted .leaflet-tile-pane{opacity:.62}  /* композитная прозрачность — дёшево, в отличие от filter */
.leaflet-control-attribution{font-size:10px;background:rgba(255,255,255,.65)!important;border-radius:6px 0 0 0}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);box-shadow:var(--shadow);border:.5px solid rgba(255,255,255,.6)}
.sub{font-size:13px;color:var(--label2)}.cap{font-size:12px;color:var(--label3)}

/* ---------- левая панель ---------- */
#side{position:fixed;left:16px;top:16px;bottom:16px;width:340px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden;z-index:500}
.side-head{padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.brand .nm{font-family:var(--brand);font-size:18px;font-weight:600;letter-spacing:.01em;line-height:1.1;white-space:nowrap}
.brand .cl{font-size:12px;color:var(--label2);margin-top:4px;white-space:nowrap}
.pill{margin-left:auto;display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;border:none;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%}
.pill.live i{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:1}50%{opacity:.35}}
.segctl{display:flex;padding:2px;border-radius:9px;background:var(--fill)}
.segctl button{flex:1;height:28px;border:none;border-radius:7px;background:transparent;font-size:13px;font-weight:500}
.segctl button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.hero{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:16px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.hero .n{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1}
.hero .t{display:flex;flex-direction:column;gap:2px}.hero .t b{font-size:15px;font-weight:600}
.stats{display:flex;gap:6px}
.stat{flex:1;padding:7px 10px;border-radius:12px;background:var(--fill2);display:flex;flex-direction:column;min-width:0}
.stat b{font-size:15px;font-weight:600}.stat span{font-size:11px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border-radius:10px;background:var(--fill);cursor:text}
.search input{flex:1;border:none;background:transparent;outline:none;font:inherit;font-size:15px;color:var(--label);min-width:0}
.kbd{font-size:11px;color:var(--label3);padding:1px 6px;border-radius:5px;background:var(--fill)}
#list{flex:1;overflow-y:auto;padding:2px 10px 10px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:none;border-radius:14px;background:transparent;text-align:left}
.row:hover{background:var(--fill2)}
.row.sel{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.row.new{animation:flash 1.6s ease 2}
@keyframes flash{0%,100%{background:transparent}50%{background:var(--red-bg)}}
.dotb{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .t1{font-size:15px;font-weight:600}.row .t2{font-size:12px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap}
.row .d{font-size:15px;font-weight:600}.row .e{font-size:12px;color:var(--label2)}
.empty{padding:28px 16px;text-align:center;color:var(--label2);font-size:13px;line-height:1.5}.empty b{display:block;color:var(--label);font-size:15px;margin-bottom:4px}
.side-foot{padding:10px 16px 13px;border-top:.5px solid var(--sep);display:flex;align-items:center;justify-content:space-between;gap:8px}
.link{border:none;background:none;color:var(--blue);font-size:13px;padding:4px 0}
.demo{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label2);white-space:nowrap;min-width:0}.demo .link{white-space:nowrap}.demo select{font:inherit;border:none;background:transparent;color:var(--blue);max-width:150px}

/* ---------- карточка ---------- */
#card{position:fixed;left:368px;top:16px;bottom:16px;width:460px;border-radius:22px;overflow-y:auto;overscroll-behavior:contain;z-index:500;display:none;background:rgba(245,245,247,.88)}
.c-head{padding:16px 16px 4px;display:flex;align-items:center;gap:12px}
.c-head .tt{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}.c-head .tt b{font-size:17px;font-weight:600}
.x{width:30px;height:30px;border-radius:50%;border:none;background:var(--fill);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.c-hero{padding:6px 16px 10px;display:flex;align-items:center;gap:12px}
.c-hero .l{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.tag{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.big{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.group{margin:0 12px 10px;border-radius:14px;background:var(--card);overflow:hidden}
.gh{margin:14px 28px 6px;font-size:13px;font-weight:600;color:var(--label2)}
.li{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:11px 14px;font-size:14px}
.li+.li{border-top:.5px solid var(--sep)}.li .k{color:var(--label2);flex-shrink:0}.li .v{text-align:right;font-weight:500}
.now{display:grid;grid-template-columns:repeat(3,1fr)}
.now div{padding:11px 12px;display:flex;flex-direction:column;gap:2px}.now div+div{border-left:.5px solid var(--sep)}
.now b{font-size:17px;font-weight:600}.now span{font-size:11px;color:var(--label2)}
.why{padding:11px 14px;display:flex;flex-direction:column;gap:5px}.why+.why{border-top:.5px solid var(--sep)}
.why .wl{display:flex;justify-content:space-between;gap:10px;font-size:13px}.why .wl b{font-weight:600;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--fill)}.bar div{height:4px;border-radius:2px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:none;background:var(--card);text-align:left}
.opt+.opt{border-top:.5px solid var(--sep)}
.opt .ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt .ot{flex:1;display:flex;flex-direction:column;gap:1px}.opt .ot b{font-size:15px;font-weight:500}
.best{font-size:11px;font-weight:600;color:var(--green-t);background:var(--green-bg);padding:1px 6px;border-radius:5px;margin-left:6px}
.cta{margin:0 12px 4px;width:calc(100% - 24px);height:44px;border:none;border-radius:12px;font-size:16px;font-weight:600}
.cfoot{margin-top:auto;position:sticky;bottom:0;padding-top:12px;background:linear-gradient(rgba(245,245,247,0),rgba(245,245,247,.97) 12px);z-index:2}
details.more summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:13px;color:var(--blue2);border-top:.5px solid var(--sep)}
details.more summary::-webkit-details-marker{display:none}
.warn{margin:0 28px 8px;font-size:11px;color:var(--label3);line-height:1.4}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px 12px}
.act{height:48px;border:none;border-radius:12px;background:var(--card);color:var(--blue2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500}
.act.on{background:var(--blue2);color:#fff}

/* ---------- карта ---------- */
#ctl{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;z-index:500;transition:right .25s ease}
#ctl.shift{right:16px}  /* карточка теперь слева, рядом с панелью */
body.ya #card{bottom:44px}
body.card-open .legend{left:calc(50% + 414px);max-width:calc(100vw - 900px)}
body.card-open #demoStrip,body.card-open #banner{left:844px;right:16px;transform:none;width:auto;min-width:0}
body.card-open #demoStrip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
body.card-open .legend{white-space:normal;flex-wrap:wrap;row-gap:4px;gap:10px;font-size:11px;padding:7px 12px}
body.card-open #toast{left:calc(50% + 414px)}  /* не закрываем логотип Яндекса */
#ctl button{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center}
#ctl button:hover{background:var(--fill2)}#ctl hr{margin:0 9px;border:0;height:.5px;background:var(--sep)}
.legend{position:fixed;left:calc(50% + 178px);transform:translateX(-50%);bottom:16px;display:flex;justify-content:center;gap:14px;padding:8px 14px;border-radius:12px;font-size:12px;color:var(--label2);z-index:450;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%}
#banner{position:fixed;left:calc(50% + 178px);top:16px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:rgba(255,246,214,.96);color:#7A5200;font-size:13px;box-shadow:var(--shadow);z-index:600;white-space:nowrap}
#banner i{width:8px;height:8px;border-radius:50%;background:#FF9F0A}
#demoStrip{position:fixed;left:calc(50% + 178px);top:16px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:7px 14px;border-radius:12px;
  background:#5E5CE6;color:#fff;font-size:13px;box-shadow:var(--shadow);z-index:590;white-space:nowrap}
#demoStrip b{font-weight:700;letter-spacing:.02em;text-transform:uppercase;font-size:11px;background:rgba(255,255,255,.22);padding:2px 7px;border-radius:6px}
body.is-demo #banner{top:58px}
#toast{position:fixed;left:calc(50% + 178px);bottom:62px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:10px 16px 10px 12px;border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:700;white-space:nowrap}
#sys{position:fixed;left:368px;top:16px;width:320px;border-radius:18px;display:none;z-index:650;overflow:hidden}#sys .li{font-size:13px}
#acct{display:flex;align-items:center;gap:8px;border:none;background:none;padding:2px 0;font-size:13px;font-weight:500;color:var(--label)}
.ava{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#8E8E93,#636366);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;text-transform:uppercase}
#settings{position:fixed;inset:0;z-index:900;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.28);padding:16px}
#settings .sheet{width:100%;max-width:560px;max-height:calc(100vh - 32px);overflow-y:auto;overflow-x:hidden;border-radius:20px;background:#F2F2F7;box-shadow:0 24px 80px rgba(0,0,0,.28)}
.sh-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(242,242,247,.94);border-bottom:.5px solid var(--sep);z-index:1}
.sh-head b{font-size:17px}.done{border:none;background:none;color:var(--blue2);font-size:17px;font-weight:600}
.sh-body{padding:6px 0 18px}
.sh-body .gh{margin:18px 32px 6px;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--label3)}
.sh-body .group{margin:0 16px}.hint{margin:6px 32px 0;font-size:12px;color:var(--label3);line-height:1.4}
.prof{display:flex;align-items:center;gap:14px;padding:14px}.prof .ava{width:52px;height:52px;font-size:22px}
.maps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:0 16px}
.mapc{position:relative;min-width:0;border:2px solid transparent;border-radius:14px;background:#fff;padding:0 0 10px;text-align:left;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mapc.on{border-color:var(--blue2)}

.mapc .pv{height:92px;display:block;width:100%}
.mapc b{display:block;padding:10px 12px 0;font-size:15px}.mapc span{display:block;padding:2px 12px 0;font-size:12px;color:var(--label2)}
.mapc .ck{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--blue2);display:none;align-items:center;justify-content:center}
.mapc.on .ck{display:flex}
.speeds{display:flex;gap:0;padding:10px 12px}
#biClose{position:sticky;float:right;top:14px;margin:14px 18px 0 0;z-index:2}
.sw{position:relative;width:46px;height:28px;border-radius:14px;border:none;background:#E9E9EA;transition:background .2s;flex-shrink:0}
.sw::after{content:'';position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:#34C759}.sw.on::after{left:20px}
#tour{position:fixed;inset:0;z-index:2000;display:none}
#tour .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);transition:all .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#tour .spot::after{content:"";position:absolute;inset:-6px;border-radius:22px;border:2px solid #0A84FF;animation:tpulse 1.6s ease-out infinite}
@keyframes tpulse{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.06)}}
#tour .tip{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));box-sizing:border-box;background:#fff;border-radius:16px;padding:18px 18px 14px;box-shadow:0 18px 50px rgba(0,0,0,.3);transition:top .4s cubic-bezier(.2,.8,.2,1),bottom .4s cubic-bezier(.2,.8,.2,1);animation:tin .35s ease;overflow-wrap:break-word;word-break:normal}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#tour .tip .tt{display:block;font-size:17px;font-weight:700;margin-bottom:6px}
#tour .tip p b{display:inline;font-size:inherit;font-weight:600}
#tour .tip .tl{display:flex;align-items:center;gap:12px;margin:0 0 10px}#tour .tip .tl>span:last-child{flex:1;min-width:0;white-space:normal;line-height:1.35}#tour .tip .tl b{display:inline;font-size:14px;margin:0}
#tour .tip .tv{position:relative;width:38px;height:38px;flex-shrink:0}#tour .tip .tv .vm{left:19px;top:19px}
#tour .tip .tline{width:38px;height:8px;border-radius:4px;background:#0A84FF;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.08);flex-shrink:0}
#tour .tip p{margin:0 0 14px;font-size:14px;line-height:1.5;color:#3A3A3C}
#tour .tip p .tl{display:flex}
#tour .tip p .ln1{display:block;margin:0 0 5px}#tour .tip p .ln1:last-child{margin-bottom:0}#tour .tip p .ln1 .tl{margin:2px 0}
#tour .tnav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#tour .dots{display:flex;gap:5px}#tour .dots i{width:6px;height:6px;border-radius:50%;background:#D1D1D6;transition:all .3s}#tour .dots i.on{width:16px;border-radius:3px;background:#0A84FF}
#tour button{border:none;border-radius:9px;height:32px;padding:0 12px;font-size:14px;font-weight:600}
#tour .next{background:#0A84FF;color:#fff}#tour .back{background:var(--fill);color:#1D1D1F}#tour .skip{background:none;color:#86868B;font-weight:500;padding:0 4px}
.fontrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:11px 14px;border:none;background:var(--card);text-align:left;font-size:19px}
.fontrow+.fontrow{border-top:.5px solid var(--sep)}
.danger{width:100%;border:none;background:var(--card);color:#FF3B30;font-size:15px;padding:12px 14px;text-align:left}

/* метка ТС: круг цвета риска + значок + стрелка курса; выбранная — пульсирующее кольцо */
.leaflet-marker-icon.veh{transition:transform var(--dur,1.4s) linear}
.leaflet-zoom-anim .leaflet-marker-icon.veh,.notrans .leaflet-marker-icon.veh{transition:none}
.vm{position:absolute;left:0;top:0;width:0;height:0}
.vm .rot{position:absolute;left:-19px;top:-19px;width:38px;height:38px}
.vm .rot::before{content:"";position:absolute;left:50%;top:-1px;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--c);filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff)}
.vm .disc{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--c);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.vm.stale .disc{background:#AEAEB2}.vm.stale{opacity:.55}
.vm.sel .disc{left:-17px;top:-17px;width:34px;height:34px;border-width:3px}
.vm .halo{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:var(--c);opacity:0;pointer-events:none}
.vm.sel .halo{animation:halo 1.8s ease-out infinite}
.vm.hot .disc{box-shadow:0 0 0 4px rgba(255,59,48,.28),0 2px 6px rgba(0,0,0,.3)}
@keyframes halo{0%{transform:scale(1);opacity:.45}100%{transform:scale(2.6);opacity:0}}
.vm .lbl{position:absolute;left:18px;top:-12px;height:24px;padding:0 9px;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);display:flex;align-items:center;gap:5px;font:600 12px var(--sf);white-space:nowrap;color:var(--label)}
.vm .lbl b{color:var(--t)}
.vm.sel .lbl{left:22px}
.stop-pin{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none}
.stop-pin .h{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#1D1D1F;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.stop-pin .h i{transform:rotate(45deg);width:8px;height:8px;border-radius:50%;background:#fff}

function makeYView(center, zoom) {

    kind: 'yandex', ym,
    polyline(ll, st, layer = 'route') {

      col[layer].add(p);

              front: () => p.options.set('zIndex', Z[layer] + 50), remove: () => col[layer].remove(p), bounds: () => p.geometry.getBounds()};

    label(ll, text, layer) { col[layer].add(new ymaps.Placemark(ll, {text}, {iconLayout: LabLayout, iconOffset:[8, -8], interactivityModel:'default#silent', zIndex: Z[layer]})); },
    marker(ll, html, o = {}) {
      const layer = o.layer || 'veh';
      const pm = new ymaps.Placemark(ll, {html, op: 1}, {iconLayout: HtmlLayout, iconShape: {type:'Circle', coordinates:[0, 0], radius:18},
        interactivityModel: o.onClick ? 'default#geoObject' : 'default#silent', zIndex: Z[layer] + (o.z || 0), cursor: o.onClick ? 'pointer' : 'default'});
      if (o.onClick) pm.events.add('click', o.onClick);

              html: (nh) => { if (nh !== h) { pm.properties.set('html', nh); h = nh; } },

    zoomBy(d) { ym.setZoom(ym.getZoom() + d, {duration:200}); },
    zoom() { return ym.getZoom(); },
    center() { return ym.getCenter(); },
    inView() { const b = ym.getBounds(); return ([la, lo]) => la >= b[0][0] && la <= b[1][0] && lo >= b[0][1] && lo <= b[1][1]; },

let V = LView;

// стартовый вид: по текущим машинам (ближе, чем вся сеть)
function fitVehicles() {
  const vs = (S.state?.vehicles || []).filter(v => v.lat != null); if (!vs.length) return;
  const la = vs.map(v => v.lat), lo = vs.map(v => v.lon);

const ROUTE_STYLE = {

  dim:   {casing: {color:'#FFFFFF', weight:5, opacity:.35}, line: {color:'#AEAEB2', weight:2.5, opacity:.35}},
  sel:   {casing: {color:'#FFFFFF', weight:10, opacity:1},  line: {color:'#0A84FF', weight:6, opacity:1}},
};

function syncRouteLines(vs) {
  for (const v of vs || []) {

    const want = v.pattern && r.patterns?.[v.pattern] ? v.pattern : 'track';

    if (cur) cur.forEach(l => l.remove());

  for (const rt of Object.values(S.routes)) rt.stops.forEach(s => { const k = s.lat.toFixed(4) + ',' + s.lon.toFixed(4); if (!uniq.has(k)) uniq.set(k, s); });

// остановки всех маршрутов: точки с 13-го зума, названия с 15-го (без наложений)
function drawStops() {

let stopsT; const drawStopsSoon = () => { clearTimeout(stopsT); stopsT = setTimeout(drawStops, 120); };
map.on('zoomend moveend', () => { if (V === LView) drawStopsSoon(); });
// ---------- формат ----------
const mins = (s) => { const m = Math.abs(s) / 60; return m < 1 ? '<1 мин' : (m < 10 ? m.toFixed(1).replace('.', ',') : Math.round(m)) + ' мин'; };

const isSynth = () => S.state?.stream.dataset === 'synthetic';
const srcShort = () => isSynth() ? 'Синтетика' : 'Архив 06.01';

const day = (ts) => { const d = new Date(ts * 1000).toLocaleDateString('ru-RU', {timeZone:'UTC', weekday:'long', day:'numeric', month:'long'}); return d[0].toUpperCase() + d.slice(1); };

const isRisk = (v) => !!v.incident && (v.risk === 'red' || v.risk === 'yellow' || v.risk === 'early');

const evKind = (v) => isEarly(v) ? 'Раньше плана' : 'Опоздание';
// раннее прибытие — свой значок, а не только знак «минус»
const evIcon = (v) => isEarly(v) ? '<svg class="ei" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>' : '';
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? b : c; };
const busIcon = (col, w = 14) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V6a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v10M6 11h12M6 16h12M8.5 16v3M15.5 16v3"/></svg>`;

  return true;
}

  || (b.incident?.p_late ?? 0) - (a.incident?.p_late ?? 0) || (b.incident?.prediction_s ?? -1e9) - (a.incident?.prediction_s ?? -1e9) || a.tr_id - b.tr_id);

function setHtml(el, h) { if (el._h !== h) { el.innerHTML = h; el._h = h; } }

function styleRoutes(byId) {
  for (const [tr, lines] of Object.entries(routeLines)) {
    const v = byId[tr], isSel = +tr === S.sel, vis = v && matches(v);
    // цвет риска на маршруте: линия текущего рейса окрашена так же, как метка его ТС
    const rk = v && !v.stale && v.incident ? v.risk : 'none';
    const key = `${isSel}|${vis}|${rk}`;
    if (S.routeStyleKey[tr] === key) continue;
    S.routeStyleKey[tr] = key;
    const base = rk === 'none' ? ROUTE_STYLE.base : {casing: ROUTE_STYLE.base.casing, line: {color: RISK[rk].fill, weight: rk === 'red' ? 4 : 3.5, opacity: .85}};
    lines.forEach(l => l.setStyle(isSel ? ROUTE_STYLE.sel : vis ? base : ROUTE_STYLE.dim));

}

function vehHtml(v, isSel) {
  const c = RISK[v.stale ? 'none' : v.risk], hot = isRisk(v);
  const lbl = hot ? `<span class="lbl">${short(v.tr_id)} <b>${isEarly(v) ? 'раньше ' + mins(v.incident.prediction_s) : sgn(v.incident.prediction_s)}</b></span>` : isSel ? `<span class="lbl">ТС ${v.tr_id}</span>` : '';
  return `<div class="vm ${isSel ? 'sel' : ''} ${hot && v.risk === 'red' ? 'hot' : ''} ${v.stale ? 'stale' : ''}" style="--c:${c.fill};--t:${c.text}">
    <div class="halo"></div>${v.heading != null ? `<div class="rot" style="transform:rotate(${Math.round(v.heading / 10) * 10}deg)"></div>` : ''}<div class="disc">${busIcon(c.fg, isSel ? 16 : 13)}</div>${lbl}</div>`;
}
function drawVehicles(vs) {
  const seen = new Set();
  for (const v of vs) {
    if (v.lat == null) continue;  // нет координат — только в списке «Без связи»
    seen.add(v.tr_id);
    const isSel = v.tr_id === S.sel, html = vehHtml(v, isSel), z = isSel ? 1000 : isRisk(v) ? 500 : 0;
    let m = markers[v.tr_id];
    if (!m) { const tr = v.tr_id; m = markers[tr] = V.marker([v.lat, v.lon], html, {cls:'veh', z, onClick: () => select(tr, false)}); }
    else {
      // интервал между точками телеметрии в реальном времени (15 с / скорость воспроизведения) — едем плавно весь интервал
      const prev = S.lastPos[v.tr_id], now = S.state.stream.stream_time;
      if (prev && (prev.lat !== v.lat || prev.lon !== v.lon) && m.el) {
        const dur = Math.min(20, Math.max(1.2, (now - prev.t) / (S.speed || 1)));
        m.el()?.style.setProperty('--dur', dur.toFixed(1) + 's');
      }
      m.move([v.lat, v.lon]); m.html(html);
    }
    if (!S.lastPos[v.tr_id] || S.lastPos[v.tr_id].lat !== v.lat || S.lastPos[v.tr_id].lon !== v.lon) S.lastPos[v.tr_id] = {lat: v.lat, lon: v.lon, t: S.state.stream.stream_time};
    m.z(z); m.opacity(matches(v) || isSel ? 1 : .6);
  }
  for (const id of Object.keys(markers)) if (!seen.has(+id)) { markers[id].remove(); delete markers[id]; }
}

// выбранное ТС: остановки его маршрута + цель; перерисовка только при смене выбора/цели
function nearestOn(line, lat, lon) {
  let best = 1e18, bi = -1;
  const k = Math.cos(lat * Math.PI / 180);
  line.forEach(([a, b], j) => { const d = ((a - lat) ** 2 + ((b - lon) * k) ** 2); if (d < best) { best = d; bi = j; } });
  return [bi, Math.sqrt(best) * 111000];
}
function drawSelection(v) {
  const i = v.incident, key = `${v.tr_id}|${i?.sample_id}|${!!S.routes}|${V.kind}|${v.pattern}`;
  if (key !== S.selKey) {
    S.selKey = key; V.clear('sel');
    (S.routes?.[v.tr_id]?.stops || []).forEach(s => V.dot([s.lat, s.lon], {r:5, color:'#3A3A3C', w:2.5}, s.name || 'Остановка', 'sel'));
    if (i) V.marker([i.target_lat, i.target_lon], `<div class="stop-pin"><div class="h"><i></i></div><div class="lab"><b>Цель · ${hhmm(i.target_time_begin)}</b><span>${esc(i.segment.to)}</span></div></div>`, {layer:'sel', z:900});
  }
  // участок маршрута от ТС до цели — цветом риска (по нитке маршрута, не прямой)
  const sk = `${key}|${v.risk}|${v.lat.toFixed(4)},${v.lon.toFixed(4)}`;
  if (sk === S.sliceKey) return;
  S.sliceKey = sk; V.clear('slice');
  if (!i || !isRisk(v)) return;
  for (const line of [routeLines[v.tr_id]?.pts || S.routes?.[v.tr_id]?.track?.[0]].filter(Boolean)) {
    const [a, da] = nearestOn(line, v.lat, v.lon), [b, db] = nearestOn(line, i.target_lat, i.target_lon);
    if (da < 250 && db < 250 && b > a) { V.polyline(line.slice(a, b + 1), {color: RISK[v.risk].fill, weight:6, opacity:.9}, 'slice'); break; }
  }
}

    return `<button class="vd ${sel ? 'sel' : ''}" data-tr="${v.tr_id}" style="left:${(v.x * 100).toFixed(2)}%;background:${c.fill};${sel ? `box-shadow:0 0 0 5px ${c.fill}55,0 1px 3px rgba(0,0,0,.3)` : ''}" title="ТС ${v.tr_id}${v.deviation_s != null ? ' · ' + (v.deviation_s >= 0 ? 'отстаёт ' : 'опережает ') + mins(v.deviation_s) : ''}"><svg width="9" height="9" viewBox="0 0 10 10"><path d="M2 1.5 8.5 5 2 8.5 3.6 5z" fill="${c.fg}"/></svg></button>`;
  }).join('');
  const bad = vs.filter(v => v.incident && (v.risk === 'red' || v.risk === 'yellow')).sort((a, b) => b.incident.prediction_s - a.incident.prediction_s)[0];
  const nog = vs.filter(v => v.no_gps), offv = vs.filter(v => v.trip_state !== 'on');
  const note = offv.length === vs.length ? `вне рейса: ${offv[0].trip_state === 'before' ? 'следующий рейс через ' + offv[0].trip_start_min + ' мин' : 'последний рейс закончился ' + offv[0].trip_end_ago_min + ' мин назад'}` : nog.length ? `нет GPS${nog[0].gps_age_s != null ? ' ' + ago(nog[0].gps_age_s).replace(' назад', '') : ' с начала потока'} — показано плановое положение` : bad ? `ТС ${bad.tr_id} ${bad.deviation_s != null && bad.deviation_s >= 60 ? 'отстаёт на ' + mins(bad.deviation_s) : 'под риском'}` : bunch ? 'сбились в пару' : '';
  const sel = vs.some(v => v.tr_id === S.sel);
  return `<div class="rb ${sel ? 'sel' : ''} ${r.on_trip ? '' : 'offtrip'}" data-pid="${r.pid}">
    <div class="rb-h">${vs.map(v => `<span class="bdg" style="background:${isRiskV(v) ? RISK[v.risk].fill : '#E8E8ED'};color:${isRiskV(v) ? RISK[v.risk].fg : '#1D1D1F'}">ТС ${v.tr_id}</span>${v.no_gps ? '<span class="kind" style="background:#F2F2F7;color:#6E6E73">нет GPS</span>' : v.trip_state !== 'on' ? '<span class="kind" style="background:#F2F2F7;color:#6E6E73">вне рейса</span>' : ''}`).join('')}

      <span class="rb-s">${r.headway_min ? `интервал по плану <b>${r.headway_min} мин</b> · ` : ''}${known.length ? `по графику <b style="color:${onTime === known.length ? 'var(--green-t)' : onTime / known.length >= .7 ? 'var(--yellow-t)' : 'var(--red-t)'}">${onTime} из ${known.length}</b> · ` : ''}${String(r.length_km).replace('.', ',')} км</span></div>

function threadSvg(th, v) {
  if (!th || th.none) return '<div class="cap" style="padding:14px 0 6px;text-align:center">Машина сейчас не в рейсе — нитки графика нет</div>';
  const W = 312, H = 168, x0 = 30, x1 = 306, y0 = 150, y1 = 14, now = th.now, t0 = now - 20 * 60, t1 = now + 25 * 60;
  const st = th.stops, i = v?.incident, pred = th.target ? th.target.prediction_s : (th.deviation_s ?? 0);
  const dev = th.deviation_s ?? 0;
  const interp = (t, xs, ys) => { if (t <= xs[0]) return ys[0]; for (let j = 1; j < xs.length; j++) if (t <= xs[j]) return ys[j - 1] + (ys[j] - ys[j - 1]) * (t - xs[j - 1]) / Math.max(1, xs[j] - xs[j - 1]); return ys[ys.length - 1]; };

  const dNow = interp(now - dev, T, D);
  const fc = [[now, dNow]];
  if (th.target) fc.push([th.target.t + pred, th.target.d]);
  st.forEach(s => { if (!th.target || s.d > th.target.d) if (s.t + pred > now) fc.push([s.t + pred, s.d]); });
  fc.sort((a, b) => a[0] - b[0]);
  const fact = st.filter(s => s.fact).map(s => [s.fact, s.d]).concat([[now, dNow]]);
  const inWin = (p) => p[0] >= t0 - 300 && p[0] <= t1 + 300;
  const ds = [...st.map(s => [s.t, s.d]), ...fact, ...fc].filter(inWin).map(p => p[1]);
  let dmin = Math.min(...ds, dNow), dmax = Math.max(...ds, dNow); if (dmax - dmin < 1) { dmax += .5; dmin -= .5; }
  const X = (t) => (x0 + (t - t0) / (t1 - t0) * (x1 - x0)).toFixed(1), Y = (d) => (y0 - (d - dmin) / (dmax - dmin) * (y0 - y1)).toFixed(1);
  const pl = (pts) => pts.map(p => X(p[0]) + ',' + Y(p[1])).join(' ');
  const c = RISK[v?.risk || 'none'];
  const ev = th.target ? [th.target.t + pred, th.target.d] : null;
  return `<svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Нитка графика: план, факт и прогноз">
    <defs><clipPath id="thc"><rect x="${x0}" y="4" width="${x1 - x0}" height="${H - 12}"/></clipPath></defs>
    <g stroke="#E5E5EA"><path d="M${x0} ${y1}H${x1}M${x0} ${(y0 + y1) / 2}H${x1}M${x0} ${y0}H${x1}"/></g>
    <rect x="${X(now + 600)}" y="10" width="${(X(now + 900) - X(now + 600)).toFixed(1)}" height="144" fill="#0A84FF" fill-opacity=".08"/>
    <g clip-path="url(#thc)"><polyline points="${pl(st.map(s => [s.t, s.d]))}" fill="none" stroke="#AEAEB2" stroke-width="2"/>
    ${st.filter(s => s.t > t0 && s.t < t1).map(s => `<circle cx="${X(s.t)}" cy="${Y(s.d)}" r="1.8" fill="#AEAEB2"/>`).join('')}
    <polyline points="${pl(fact)}" fill="none" stroke="#0A84FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="${pl(fc)}" fill="none" stroke="${c.fill}" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
    ${ev ? `<circle cx="${X(ev[0])}" cy="${Y(ev[1])}" r="6" fill="${c.fill}" stroke="#fff" stroke-width="2"/>` : ''}</g>
    <path d="M${X(now)} 8V154" stroke="#1D1D1F" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="${X(now)}" y="166" font-size="9" fill="#1D1D1F" text-anchor="middle">сейчас</text>
    <text x="${x0}" y="166" font-size="9" fill="#8E8E93">${hhmm(t0)}</text><text x="${x1}" y="166" font-size="9" fill="#8E8E93" text-anchor="end">${hhmm(t1)}</text>
    <text x="2" y="18" font-size="9" fill="#8E8E93">даль.</text><text x="2" y="153" font-size="9" fill="#8E8E93">ближ.</text></svg>`;
}
// мини-карта в карточке события: где машина сейчас, её рейс и целевая остановка; подложка — как в настройках
let mini = null;
function miniOpenBig() { const t = S.sel; setView('map'); select(t, true); }
function miniEnsure() {
  const kind = S.provider === 'yandex' && window.ymaps && ymaps.Map ? 'yandex' : 'osm';
  $('#lnMini').classList.toggle('muted', !!S.muted);
  if (mini && mini.kind === kind) return mini;
  if (mini) { try { mini.kind === 'osm' ? mini.map.remove() : mini.map.destroy(); } catch (e) {} }
  const host = $('#lnMini'); host.innerHTML = '<div style="width:100%;height:100%"></div>'; const el = host.firstChild;
  if (kind === 'osm') {
    const m = L.map(el, {zoomControl:false, scrollWheelZoom:false}).setView([55.75, 37.62], 12);
    m.attributionControl.setPrefix(false);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(m);
    mini = {kind, map:m, layer:L.layerGroup().addTo(m)};
    m.on('click', miniOpenBig);
  } else {
    const m = new ymaps.Map(el, {center:[55.75, 37.62], zoom:12, controls:[]}, {suppressMapOpenBlock:true, yandexMapDisablePoiInteractivity:true});
    m.behaviors.disable('scrollZoom'); m.events.add('click', miniOpenBig);
    mini = {kind, map:m};

  return mini;
}
function renderMini(v) {
  const box = $('#lnMiniBox');
  if (!v || S.view !== 'lines') { box.style.display = 'none'; return; }
  box.style.display = '';
  const mm = miniEnsure(), m = mm.map;
  if (mm.kind === 'osm') m.invalidateSize(); else m.container.fitToViewport();
  const i = v.incident, c = RISK[v.stale ? 'none' : v.risk];
  $('#lnMiniNote').textContent = v.lat == null ? 'Нет GPS — положение неизвестно' : v.stale ? `Последняя известная точка · GPS ${ago(v.age_s)}` : `${Math.round(v.speed)} км/ч · GPS ${ago(v.age_s)} · нажмите на карту, чтобы открыть большую`;
  const key = JSON.stringify([mm.kind, v.tr_id, v.lat, v.lon, c.fill, v.pattern, i?.target_stop_id, S.routesVersion]);
  if (key === S.miniKey) return;
  const first = S.miniTr !== v.tr_id; S.miniKey = key; S.miniTr = v.tr_id;
  const line = S.routes?.[v.tr_id]?.patterns?.[v.pattern];
  const tgt = i && isRisk(v) ? [i.target_lat, i.target_lon] : null, me = v.lat != null ? [v.lat, v.lon] : null;
  const pts = [me, tgt].filter(Boolean);
  if (mm.kind === 'osm') {
    mm.layer.clearLayers();
    if (line?.length > 1) L.polyline(line, {color:'#0A84FF', weight:4, opacity:.55}).addTo(mm.layer);
    if (tgt) L.circleMarker(tgt, {radius:6, color:'#fff', weight:2, fillColor:c.fill, fillOpacity:1}).bindTooltip(esc(i.target_name), {direction:'top'}).addTo(mm.layer);
    if (me) L.circleMarker(me, {radius:9, color:'#fff', weight:3, fillColor:c.fill, fillOpacity:1}).bindTooltip('ТС ' + v.tr_id, {direction:'top'}).addTo(mm.layer);
    if (first || (me && !m.getBounds().pad(-0.15).contains(me))) {
      if (pts.length === 2) m.fitBounds(L.latLngBounds(pts).pad(0.35), {maxZoom:16});
      else if (pts.length) m.setView(pts[0], 15);
      else if (line?.length > 1) m.fitBounds(L.latLngBounds(line).pad(0.05));
    }
  } else {
    m.geoObjects.removeAll();
    if (line?.length > 1) m.geoObjects.add(new ymaps.Polyline(line, {}, {strokeColor:'#0A84FF', strokeWidth:4, strokeOpacity:.55}));
    if (tgt) m.geoObjects.add(new ymaps.Placemark(tgt, {hintContent: i.target_name}, {preset:'islands#circleIcon', iconColor:c.fill}));
    if (me) m.geoObjects.add(new ymaps.Placemark(me, {hintContent: 'ТС ' + v.tr_id}, {preset:'islands#circleDotIcon', iconColor:c.fill}));
    const inView = me && ymaps.util.bounds.containsPoint(m.getBounds(), me);
    if (first || (me && !inView)) {
      if (pts.length === 2) m.setBounds(ymaps.util.bounds.fromPoints(pts), {checkZoomRange:true, zoomMargin:40});
      else if (pts.length) m.setCenter(pts[0], 15);
      else if (line?.length > 1) m.setBounds(ymaps.util.bounds.fromPoints(line), {zoomMargin:10});
    }
  }
}
function incidentHtml(v) {
  if (!v) return `<div class="ln-none"><b>Выберите ТС</b><span class="sub">на ленте или во входящих слева — здесь появятся нитка графика, остановка, время и журнал</span></div>`;
  const i = v.incident, c = RISK[v.stale ? 'none' : v.risk], r = isRisk(v);
  return `<div class="ln-ih"><span class="bdg" style="background:${c.fill};color:${c.fg}">${short(v.tr_id)}</span><span class="sub">ТС ${v.tr_id} · борт ${v.unit_id ?? '—'}</span>${r ? `<span class="tag" style="margin-left:auto;background:${c.bg};color:${c.text}">${c.tag}</span>` : ''}</div>
    <div class="ln-hl" style="color:${r ? c.text : 'var(--label)'}">${evHead(v)}</div>
    ${i ? `<div class="sub">${r ? '' : 'следующая цель: '}${esc(sn(i.target_name))} · через ${i.eta_min} мин</div>` : ''}
    <div class="ln-th"><div class="ln-th-h"><b>Нитка графика</b><span class="cap">путь по рейсу × время</span></div>${threadSvg(S.thread[v.tr_id], v)}
      <div class="ln-leg" style="${!S.thread[v.tr_id] || S.thread[v.tr_id].none ? 'display:none' : ''}"><span><i style="background:#AEAEB2;height:2px"></i>план</span><span><i style="background:#0A84FF"></i>факт</span><span><i style="background:${c.fill}"></i>прогноз</span><span><i style="background:rgba(10,132,255,.14);height:8px"></i>окно 10–15 мин</span></div></div>
    <div class="ln-body">${evFacts(v)}${evRecs(v)}${evWhy(v, c.fill)}${evLog(v)}</div>`;

function renderLines() {

  const v = S.state.vehicles.find(x => x.tr_id === S.sel);

$('#lnRows').addEventListener('click', (e) => {
  const d = e.target.closest('.vd'); if (d) { lnSelect(+d.dataset.tr); return; }
  const rb = e.target.closest('.rb'); if (!rb) return;
  const r = S.rib?.rows.find(x => x.pid === rb.dataset.pid); if (!r) return;
  const order = {red:0, yellow:1, early:2, green:3, none:4};
  lnSelect(r.vehicles.slice().sort((a, b) => order[a.risk] - order[b.risk])[0].tr_id);

$('#lnSide').addEventListener('click', (e) => {
  const v = S.state?.vehicles.find(x => x.tr_id === S.sel); if (!v) return;

function lnSelect(tr) {

setInterval(() => { if (S.view === 'lines' && S.sel) loadThread(S.sel); }, 5000);
setView('map');
document.addEventListener('fullscreenchange', () => { if ($('#settings').style.display === 'flex') renderSettings(); setTimeout(() => { map.invalidateSize(); }, 200); });

loadDatasets();
// сглаженный режим: по умолчанию включён, выбор хранится в браузере
function applySmooth(on) {
